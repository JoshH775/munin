# prod database — run from /srv/munin. no reset script exists for this on purpose.
name: munin-prod

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_PASSWORD: postgres
    ports:
      - "127.0.0.1:20132:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD", "pg_isready", "-U", "postgres", "-h", "127.0.0.1"]
      interval: 2s
      retries: 15

volumes:
  pgdata:
